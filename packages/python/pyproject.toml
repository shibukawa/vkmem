[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vkmem"
version = "0.1.0"
description = "In-memory Valkey for Python tests"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yoshiki Shibukawa" }]
keywords = ["valkey", "redis", "testing", "in-memory", "test-server"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
pytest = ["pytest>=7"]

[project.entry-points.pytest11]
vkmem = "vkmem.pytest_plugin"

[project.urls]
Homepage = "https://github.com/shibukawa/vkmem"
Repository = "https://github.com/shibukawa/vkmem"

[tool.hatch.build.targets.wheel]
packages = ["src/vkmem"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/vkmem", "hatch_build.py", "README.md", "LICENSE"]
exclude = ["src/vkmem/_bin/vkmem-server", "src/vkmem/_bin/vkmem-server.exe"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
